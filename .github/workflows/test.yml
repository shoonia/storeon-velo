name: test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm

    - run: npm test

    - uses: andresz1/size-limit-action@v1
      with:
        skip_step: build
        github_token: ${{ secrets.GITHUB_TOKEN }}